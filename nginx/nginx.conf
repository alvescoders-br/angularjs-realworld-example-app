# Nginx config for Conduit Angular 21 SPA (PP-6.1: static, no SSR)
# Refs: GUIA §9, issue #8
# PP-6.3 guardrail: no security headers / CSP that change security posture.
# If security headers are needed, stop and reclassify (possible C).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Serve hashed assets with long-lived cache (outputHashing: 'all' in angular.json)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
